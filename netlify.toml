[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/db/*.sql"]

# Proxy all /api/* requests to the Netlify Serverless Express API function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: send all client-side routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
